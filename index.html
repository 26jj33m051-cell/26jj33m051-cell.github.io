<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON RUSH — Arcade Racer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#20265a 0,#090d20 55%,#050711 100%);color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,960px)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}h1{font-size:clamp(28px,5vw,48px);letter-spacing:4px;margin:0;color:#67f7ff;text-shadow:0 0 18px #00d9ff}header p{margin:4px 0 0;color:#9eacd0;font-size:13px;letter-spacing:2px}.hud{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#101936;border:1px solid #293b69;border-radius:12px;padding:9px 14px;min-width:82px;text-align:center}.stat small{display:block;color:#8fa1c9;font-size:10px;letter-spacing:1px}.stat b{font-size:20px;color:#fff}.gamebox{position:relative;border:2px solid #3d5d9b;border-radius:18px;overflow:hidden;box-shadow:0 0 40px #00c8ff22;background:#080d1c}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#050916bb;text-align:center;padding:24px}.panel{max-width:420px}.panel h2{font-size:clamp(28px,5vw,42px);margin:0 0 8px;color:#fff;text-shadow:0 0 16px #00d9ff}.panel p{color:#c1cce7;line-height:1.6}.btn{border:0;border-radius:999px;background:linear-gradient(100deg,#00d9ff,#8d65ff);color:#071022;font-weight:900;font-size:16px;padding:13px 28px;cursor:pointer;box-shadow:0 6px 24px #00d9ff44}.hint{color:#91a2ca;font-size:12px;margin-top:14px}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#91a2ca;font-size:12px;margin:12px 4px}.touch{display:none;justify-content:center;gap:22px;margin-top:12px}.touch button{width:76px;height:56px;border-radius:14px;border:1px solid #4665a2;background:#172449;color:#fff;font-size:24px}@media(max-width:650px){header{display:block}.hud{margin-top:12px}.stat{flex:1}.touch{display:flex}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>NEON RUSH</h1><p>ARCADE HIGHWAY • SURVIVE THE TRAFFIC</p></div><div class="hud"><div class="stat"><small>SCORE</small><b id="score">00000</b></div><div class="stat"><small>BEST</small><b id="best">00000</b></div><div class="stat"><small>SPEED</small><b id="speed">1</b></div></div></header>
<div class="gamebox"><canvas id="game" width="900" height="560" aria-label="레이싱 게임 화면"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="headline">READY TO RACE?</h2><p id="message">차선을 바꾸며 차량을 피하세요.<br>오래 버틸수록 속도가 빨라집니다!</p><button class="btn" id="start">RACE START</button><div class="hint">← → 또는 A / D 키로 이동 · 모바일은 아래 버튼</div></div></div></div>
<div class="touch"><button id="left" aria-label="왼쪽">◀</button><button id="right" aria-label="오른쪽">▶</button></div>
<div class="bottom"><span>조작: ← → / A D</span><span>충돌하면 게임 종료 · 최고 기록은 이 기기에 저장됩니다</span></div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed');
let best=Number(localStorage.getItem('neonRushBest')||0),score=0,player=1,cars=[],running=false,last=0,spawn=0,roadOffset=0,speed=300;
bestEl.textContent=String(best).padStart(5,'0');
const lanes=[330,450,570],colors=['#ff477e','#ffb84d','#8b78ff','#45e0a8','#f5f7ff'];
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCar(x,y,color,hero=false){rounded(x-29,y-48,58,96,13,'#030711');rounded(x-25,y-46,50,92,11,color);rounded(x-19,y-30,38,27,7,hero?'#b7f8ff':'#26395c');rounded(x-18,y+8,36,22,6,hero?'#174d68':'#17233e');ctx.fillStyle='#f9f4c7';ctx.fillRect(x-21,y-43,10,5);ctx.fillRect(x+11,y-43,10,5);ctx.fillStyle='#ff426d';ctx.fillRect(x-21,y+39,9,5);ctx.fillRect(x+12,y+39,9,5);if(hero){ctx.shadowColor='#00eaff';ctx.shadowBlur=20;ctx.strokeStyle='#9cfaff';ctx.lineWidth=2;ctx.strokeRect(x-26,y-47,52,94);ctx.shadowBlur=0}}
function road(){ctx.fillStyle='#101a2c';ctx.fillRect(0,0,900,560);ctx.fillStyle='#18243a';ctx.fillRect(260,0,380,560);ctx.fillStyle='#d9e6ff';ctx.fillRect(270,0,5,560);ctx.fillRect(625,0,5,560);ctx.fillStyle='#415578';for(let y=-50;y<600;y+=80){let yy=(y+roadOffset)%640;ctx.fillRect(390,yy,5,42);ctx.fillRect(505,yy,5,42)}ctx.fillStyle='#ffcc63';for(let y=-30;y<600;y+=100){let yy=(y+roadOffset*1.3)%640;ctx.fillRect(250,yy,8,35);ctx.fillRect(642,yy,8,35)}}
function render(){road();cars.forEach(car=>drawCar(lanes[car.lane],car.y,car.color));drawCar(lanes[player],475,'#27dfff',true);ctx.fillStyle='#9eb3df';ctx.font='14px system-ui';ctx.fillText('NEON HIGHWAY',24,32)}
function reset(){score=0;speed=300;player=1;cars=[];spawn=0;roadOffset=0;scoreEl.textContent='00000';speedEl.textContent='1'}
function end(){running=false;let final=Math.floor(score);if(final>best){best=final;localStorage.setItem('neonRushBest',best);bestEl.textContent=String(best).padStart(5,'0')}document.getElementById('headline').textContent='CRASHED!';document.getElementById('message').innerHTML='최종 점수 <b>'+final+'</b><br>다시 도전해서 기록을 갱신하세요!';document.getElementById('start').textContent='TRY AGAIN';overlay.style.display='grid'}
function update(dt){score+=dt*12;speed=Math.min(680,300+score*1.1);roadOffset=(roadOffset+speed*dt)%640;spawn-=dt;if(spawn<=0){let lane=Math.floor(Math.random()*3);cars.push({lane,y:-65,color:colors[Math.floor(Math.random()*colors.length)]});spawn=Math.max(.38,1.05-score/1500)*(0.75+Math.random()*.5)}cars.forEach(car=>car.y+=speed*dt);cars=cars.filter(car=>car.y<650);if(cars.some(car=>car.lane===player&&car.y>385&&car.y<520)){end()}scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');speedEl.textContent=String(Math.floor(speed/300*1.0))}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);render();if(running)requestAnimationFrame(loop)}
function start(){reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
function move(dir){if(running)player=Math.max(0,Math.min(2,player+dir))}
document.getElementById('start').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);if((e.key==='Enter'||e.key===' ')&&!running)start()});
document.getElementById('left').addEventListener('pointerdown',()=>move(-1));document.getElementById('right').addEventListener('pointerdown',()=>move(1));
render();
})();
</script></body></html>
