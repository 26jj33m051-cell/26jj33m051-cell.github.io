<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON RUSH — Arcade Racer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#20265a 0,#090d20 55%,#050711 100%);color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,960px)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}h1{font-size:clamp(28px,5vw,48px);letter-spacing:4px;margin:0;color:#67f7ff;text-shadow:0 0 18px #00d9ff}header p{margin:4px 0 0;color:#9eacd0;font-size:13px;letter-spacing:2px}.hud{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#101936;border:1px solid #293b69;border-radius:12px;padding:9px 14px;min-width:82px;text-align:center}.stat small{display:block;color:#8fa1c9;font-size:10px;letter-spacing:1px}.stat b{font-size:20px;color:#fff}.gamebox{position:relative;border:2px solid #3d5d9b;border-radius:18px;overflow:hidden;box-shadow:0 0 40px #00c8ff22;background:#080d1c}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#050916bb;text-align:center;padding:24px}.panel{max-width:420px}.panel h2{font-size:clamp(28px,5vw,42px);margin:0 0 8px;color:#fff;text-shadow:0 0 16px #00d9ff}.panel p{color:#c1cce7;line-height:1.6}.btn{border:0;border-radius:999px;background:linear-gradient(100deg,#00d9ff,#8d65ff);color:#071022;font-weight:900;font-size:16px;padding:13px 28px;cursor:pointer;box-shadow:0 6px 24px #00d9ff44}.hint{color:#91a2ca;font-size:12px;margin-top:14px}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#91a2ca;font-size:12px;margin:12px 4px}.touch{display:none;justify-content:center;gap:22px;margin-top:12px}.touch button{width:76px;height:56px;border-radius:14px;border:1px solid #4665a2;background:#172449;color:#fff;font-size:24px}@media(max-width:650px){header{display:block}.hud{margin-top:12px}.stat{flex:1}.touch{display:flex}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>NEON RUSH</h1><p>ARCADE HIGHWAY • SURVIVE THE TRAFFIC</p></div><div class="hud"><div class="stat"><small>SCORE</small><b id="score">00000</b></div><div class="stat"><small>BEST</small><b id="best">00000</b></div><div class="stat"><small>SPEED</small><b id="speed">1.4x</b></div></div></header>
<div class="gamebox"><canvas id="game" width="900" height="560" aria-label="레이싱 게임 화면"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="headline">READY TO RACE?</h2><p id="message">자동차와 콘, 바리케이드를 피하세요.<br>시간이 지날수록 장애물이 더 많이 나옵니다!</p><button class="btn" id="start">RACE START</button><div class="hint">← → 또는 A / D 키로 이동 · 모바일은 아래 버튼</div></div></div></div>
<div class="touch"><button id="left" aria-label="왼쪽">◀</button><button id="right" aria-label="오른쪽">▶</button></div>
<div class="bottom"><span>조작: ← → / A D</span><span>차량 · 콘 · 바리케이드 장애물 다수 출현</span></div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed');
const START_SPEED=420,MAX_SPEED=960;
let best=Number(localStorage.getItem('neonRushBest')||0),score=0,player=1,cars=[],running=false,last=0,spawn=0,roadOffset=0,speed=START_SPEED;
bestEl.textContent=String(best).padStart(5,'0');
const lanes=[330,450,570],colors=['#ff477e','#ffb84d','#8b78ff','#45e0a8','#f5f7ff'];
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function laneX(lane,y){const depth=Math.max(0,Math.min(1,(y+35)/595));return 450+(lane-1)*(38+152*depth)/3}
function drawCar(x,y,color,hero=false,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.shadowOffsetY=8;rounded(-29,-48,58,96,13,'#030711');ctx.shadowBlur=0;ctx.shadowOffsetY=0;const body=ctx.createLinearGradient(-25,-40,25,40);body.addColorStop(0,hero?'#a6f7ff':color);body.addColorStop(.38,color);body.addColorStop(1,hero?'#087eaa':'#40234f');rounded(-25,-46,50,92,11,body);rounded(-19,-30,38,27,7,hero?'#c9fbff':'#304a70');rounded(-18,8,36,22,6,hero?'#174d68':'#17233e');ctx.fillStyle='#f9f4c7';ctx.fillRect(-21,-43,10,5);ctx.fillRect(11,-43,10,5);ctx.fillStyle='#ff426d';ctx.fillRect(-21,39,9,5);ctx.fillRect(12,39,9,5);ctx.fillStyle='#ffffff66';ctx.fillRect(-21,-35,3,54);if(hero){ctx.shadowColor='#00eaff';ctx.shadowBlur=20;ctx.strokeStyle='#9cfaff';ctx.lineWidth=2;ctx.strokeRect(-26,-47,52,94)}ctx.restore()}
function drawObstacle(x,y,obstacle){const scale=.38+.62*Math.max(0,Math.min(1,(y+35)/595));if(obstacle.type==='car'){drawCar(x,y,obstacle.color,false,scale);return}ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(obstacle.type==='cone'){ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.shadowOffsetY=5;ctx.fillStyle='#d94c1c';ctx.fillRect(-31,27,62,9);ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle='#ff7a28';ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(25,27);ctx.lineTo(-25,27);ctx.closePath();ctx.fill();ctx.fillStyle='#fff0d6';ctx.fillRect(-17,2,34,7);ctx.restore();return}ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.shadowOffsetY=6;ctx.fillStyle='#343c50';ctx.fillRect(-34,-17,68,35);ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle='#ffbf47';ctx.beginPath();ctx.moveTo(-28,17);ctx.lineTo(-19,17);ctx.lineTo(-1,-17);ctx.lineTo(-10,-17);ctx.fill();ctx.beginPath();ctx.moveTo(-3,17);ctx.lineTo(6,17);ctx.lineTo(24,-17);ctx.lineTo(15,-17);ctx.fill();ctx.fillStyle='#ffdf86';ctx.fillRect(-38,17,76,6);ctx.restore()}
function road(){ctx.fillStyle='#101a2c';ctx.fillRect(0,0,900,560);ctx.fillStyle='#132038';ctx.beginPath();ctx.moveTo(410,55);ctx.lineTo(490,55);ctx.lineTo(665,560);ctx.lineTo(235,560);ctx.closePath();ctx.fill();ctx.fillStyle='#273753';ctx.beginPath();ctx.moveTo(416,55);ctx.lineTo(423,55);ctx.lineTo(279,560);ctx.lineTo(258,560);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(477,55);ctx.lineTo(484,55);ctx.lineTo(642,560);ctx.lineTo(621,560);ctx.closePath();ctx.fill();for(let i=0;i<18;i++){const depth=((i/18+roadOffset/640)%1),t=depth*depth,y=55+t*520,half=40+t*175,thickness=1+t*5,dash=4+t*34;ctx.fillStyle='#91a5c9';ctx.fillRect(450-half/3-thickness/2,y,thickness,dash);ctx.fillRect(450+half/3-thickness/2,y,thickness,dash);ctx.fillStyle='#ffcc63';ctx.fillRect(450-half-5-thickness/2,y,thickness+5,dash*.72);ctx.fillRect(450+half+thickness/2,y,thickness+5,dash*.72)}const horizon=ctx.createLinearGradient(0,0,0,170);horizon.addColorStop(0,'#1c2850');horizon.addColorStop(1,'#101a2c');ctx.fillStyle=horizon;ctx.fillRect(0,0,900,55)}
function render(){road();cars.sort((a,b)=>a.y-b.y).forEach(obstacle=>drawObstacle(laneX(obstacle.lane,obstacle.y),obstacle.y,obstacle));drawCar(laneX(player,475),475,'#27dfff',true,.92);ctx.fillStyle='#9eb3df';ctx.font='14px system-ui';ctx.fillText('NEON HIGHWAY',24,32)}
function reset(){score=0;speed=START_SPEED;player=1;cars=[];spawn=0;roadOffset=0;scoreEl.textContent='00000';speedEl.textContent=(speed/300).toFixed(1)+'x'}
function end(){running=false;let final=Math.floor(score);if(final>best){best=final;localStorage.setItem('neonRushBest',best);bestEl.textContent=String(best).padStart(5,'0')}document.getElementById('headline').textContent='CRASHED!';document.getElementById('message').innerHTML='최종 점수 <b>'+final+'</b><br>다시 도전해서 기록을 갱신하세요!';document.getElementById('start').textContent='TRY AGAIN';overlay.style.display='grid'}
function update(dt){
score+=dt*18;
speed=Math.min(MAX_SPEED,START_SPEED+score*1.7);
roadOffset=(roadOffset+speed*dt)%640;
spawn-=dt;
if(spawn<=0){
const lane=Math.floor(Math.random()*3),secondLane=(lane+1+Math.floor(Math.random()*2))%3;
const color=()=>colors[Math.floor(Math.random()*colors.length)];
const type=()=>{const roll=Math.random();return roll<.4?'car':roll<.72?'cone':'barrier'};
const count=Math.random()<Math.min(.68,.4+score/2400)?2:1;
cars.push({lane,y:-65,color:color(),type:type()});
if(count===2)cars.push({lane:secondLane,y:-65,color:color(),type:type()});
spawn=Math.max(.4,.82-score/2400)*(.82+Math.random()*.36)
}
cars.forEach(car=>car.y+=speed*dt);
cars=cars.filter(car=>car.y<650);
if(cars.some(car=>car.lane===player&&Math.abs(car.y-475)<78)){end()}
scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');
speedEl.textContent=(speed/300).toFixed(1)+'x'
}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);render();if(running)requestAnimationFrame(loop)}
function start(){reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
function move(dir){if(running)player=Math.max(0,Math.min(2,player+dir))}
document.getElementById('start').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);if((e.key==='Enter'||e.key===' ')&&!running)start()});
document.getElementById('left').addEventListener('pointerdown',()=>move(-1));document.getElementById('right').addEventListener('pointerdown',()=>move(1));
render();
})();
</script></body></html>
