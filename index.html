<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10251d"><title>PIXEL FOOTBALL — 픽셀 축구</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700;900&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(ellipse at top,#28533d,#101d19 70%);color:#f4f7ed;font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;align-items:center}.wrap{width:min(100%,900px)}header{text-align:center;margin:0 0 14px}.logo{font:clamp(18px,4vw,29px) 'Press Start 2P',monospace;color:#ffe36e;text-shadow:3px 4px #a54d37}.sub{font-size:11px;color:#b8d0bd;letter-spacing:3px;margin-top:10px}.panel{background:#172d25;border:3px solid #54735b;border-radius:12px;padding:12px;box-shadow:0 8px #09140f}.hud{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:10px}.team{font:12px 'Press Start 2P',monospace;color:#9ed5ff}.score{font:26px 'Press Start 2P',monospace;color:#ffe36e;min-width:90px;text-align:center}.clock{font:13px 'Press Start 2P',monospace;color:#fff;margin-left:auto}.field{position:relative;border:4px solid #d9e6c8;border-radius:5px;overflow:hidden;background:#28794b}canvas{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;background:#07160fdd;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.overlay.hidden{display:none}.modal{max-width:460px}.modal h2{font:clamp(16px,3vw,22px) 'Press Start 2P',monospace;color:#ffe36e;line-height:1.8}.modal p{font-size:13px;line-height:1.9;color:#d5e4d5}button{border:0;border-radius:8px;padding:13px 18px;background:#ffe36e;color:#17251b;font-weight:900;font-size:14px;box-shadow:0 4px #b78635;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px #b78635}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.help{font-size:11px;color:#b9cdbd;line-height:1.8}.touch{display:none;gap:7px;align-items:center}.touch button{padding:10px 14px;background:#bce4f5;box-shadow:0 3px #759db0}.foot{margin-top:12px;text-align:center;font-size:11px;color:#a9c0ad;line-height:1.8}
@media(max-width:620px){body{padding:8px}.panel{padding:7px}.hud{gap:7px}.team{font-size:9px}.score{font-size:19px;min-width:62px}.clock{font-size:10px}.touch{display:flex}.help{display:none}.bar{justify-content:center}}
</style>
</head>
<body><main class="wrap">
<header><div class="logo">PIXEL FOOTBALL</div><div class="sub">8-BIT MINI SOCCER CUP</div></header>
<section class="panel">
<div class="hud"><span class="team">BLUE</span><span class="score" id="score">0 : 0</span><span class="team" style="color:#ffb0a4">RED</span><span class="clock" id="clock">90</span></div>
<div class="field"><canvas id="game" width="800" height="500" aria-label="픽셀 축구 경기"></canvas><div class="overlay" id="overlay"><div class="modal"><h2 id="headline">KICK OFF!</h2><p id="message">파란 팀을 조종해 빨간 팀을 이기세요!<br>이동: 방향키 또는 WASD · 슛: SPACE<br>공 근처에서 스페이스를 누르면 슛합니다.</p><button id="start">경기 시작 ▶</button></div></div></div>
<div class="bar"><div class="help">이동: 방향키 / WASD　 슛: SPACE　 질주: SHIFT<br>공을 몰고 상대 골대(오른쪽)로 달려가세요!</div><div class="touch"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button><button id="shoot">슛!</button></div><button id="pause" style="background:#bce4f5;box-shadow:0 4px #759db0">Ⅱ 일시정지</button></div>
</section><div class="foot">🏟️ BLUE FC vs RED FC · 90초 한판 승부<br>최고 기록은 이 기기에 저장됩니다.</div>
</main>
<script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=800,H=500,$=id=>document.getElementById(id);
let blue=[],red=[],ball={x:400,y:250,vx:0,vy:0},keys={},running=false,paused=false,remaining=90,goals=[0,0],last=0,elapsed=0,frame=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function makeTeam(){blue=[{x:180,y:250,vx:0,vy:0,keeper:false},{x:290,y:125},{x:290,y:375},{x:390,y:250}];red=[{x:620,y:250,keeper:false},{x:510,y:125},{x:510,y:375},{x:410,y:250}];}
function field(){g.fillStyle='#28794b';g.fillRect(0,0,W,H);for(let i=0;i<8;i++){g.fillStyle=i%2?'#2d824f':'#28794b';g.fillRect(i*100,0,100,H)}g.strokeStyle='#e5efdc';g.lineWidth=4;g.strokeRect(20,20,760,460);g.beginPath();g.moveTo(400,20);g.lineTo(400,480);g.stroke();g.beginPath();g.arc(400,250,68,0,Math.PI*2);g.stroke();g.strokeRect(20,155,95,190);g.strokeRect(685,155,95,190);g.strokeRect(20,205,35,90);g.strokeRect(745,205,35,90);g.fillStyle='#e5efdc';g.beginPath();g.arc(400,250,4,0,7);g.fill();g.fillStyle='#d9e9dc';g.fillRect(0,200,20,100);g.fillRect(780,200,20,100)}
function player(p,color,selected=false){g.save();g.translate(p.x,p.y);g.fillStyle='#102019';g.fillRect(-10,11,20,5);g.fillStyle=color;g.fillRect(-10,-12,20,24);g.fillStyle=selected?'#fff3a1':'#f1d5b2';g.fillRect(-7,-19,14,9);g.fillStyle='#182a24';g.fillRect(-5,-16,2,2);g.fillRect(3,-16,2,2);g.fillStyle='#fff';g.fillRect(-9,8,7,5);g.fillRect(3,8,7,5);if(selected){g.fillStyle='#ffe36e';g.beginPath();g.moveTo(0,-28);g.lineTo(-6,-36);g.lineTo(6,-36);g.fill()}g.restore()}
function draw(){field();g.fillStyle='#dbe6d8';g.fillRect(0,196,14,108);g.fillRect(786,196,14,108);blue.forEach((p,i)=>player(p,'#238ee8',i===0));red.forEach(p=>player(p,'#e64e4e'));g.fillStyle='#101820';g.beginPath();g.arc(ball.x,ball.y,10,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(ball.x-3,ball.y-3,5,0,7);g.fill();g.fillStyle='#fff';g.font='bold 13px monospace';g.fillText('BLUE ATTACK →',30,45)}
function resetPositions(){makeTeam();ball={x:400,y:250,vx:0,vy:0}}
function update(dt){frame++;let p=blue[0],dx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),dy=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0),mag=Math.hypot(dx,dy)||1,spd=(keys.Shift?3.7:2.65);p.x=clamp(p.x+dx/mag*spd*dt,28,772);p.y=clamp(p.y+dy/mag*spd*dt,28,472);
blue.slice(1).forEach((q,i)=>{let target=i===0?ball:{x:ball.x-65,y:ball.y+(i===1?-95:95)};let d=dist(q,target);if(d>12){q.x+=((target.x-q.x)/d)*1.5*dt;q.y+=((target.y-q.y)/d)*1.5*dt}q.x=clamp(q.x,25,775);q.y=clamp(q.y,25,475)});
red.forEach((q,i)=>{let target=i===0?{x:735,y:ball.y}:ball,d=dist(q,target),v=i===0?1.35:1.1;if(d>10){q.x+=(target.x-q.x)/d*v*dt;q.y+=(target.y-q.y)/d*v*dt}q.x=clamp(q.x,25,775);q.y=clamp(q.y,25,475)});
[...blue,...red].forEach(q=>{let d=dist(q,ball);if(d<22&&d>0){let nx=(ball.x-q.x)/d,ny=(ball.y-q.y)/d;ball.vx+=nx*.42*dt;ball.vy+=ny*.42*dt}});
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.986,dt);ball.vy*=Math.pow(.986,dt);if(ball.y<30||ball.y>470){ball.y=clamp(ball.y,30,470);ball.vy*=-.65}
if(ball.x<18){if(ball.y>200&&ball.y<300){goals[1]++;kickoff()}else{ball.x=18;ball.vx=Math.abs(ball.vx)*.7}}
if(ball.x>782){if(ball.y>200&&ball.y<300){goals[0]++;kickoff()}else{ball.x=782;ball.vx=-Math.abs(ball.vx)*.7}}
if(keys[' ']&&dist(p,ball)<48){let a=Math.atan2(ball.y-p.y,ball.x-p.x);ball.vx=Math.cos(a)*9.5;ball.vy=Math.sin(a)*9.5;keys[' ']=false}
$('score').textContent=goals[0]+' : '+goals[1];}
function kickoff(){resetPositions();$('score').textContent=goals[0]+' : '+goals[1]}
function finish(){running=false;let title=goals[0]>goals[1]?'YOU WIN!':goals[0]===goals[1]?'DRAW!':'YOU LOSE!';$('headline').textContent=title;$('message').innerHTML='최종 스코어 <b style="color:#ffe36e">'+goals[0]+' : '+goals[1]+'</b><br>다시 한판 도전해 보세요!';$('start').textContent='다시 경기하기 ▶';$('overlay').classList.remove('hidden');}
function loop(t){if(!running)return;if(!last)last=t;let dt=Math.min((t-last)/16.67,2);last=t;if(!paused){elapsed+=dt/60;remaining=Math.max(0,90-elapsed);$('clock').textContent=Math.ceil(remaining);update(dt);draw();if(remaining<=0){finish();return}}requestAnimationFrame(loop)}
function start(){goals=[0,0];remaining=90;elapsed=0;last=0;paused=false;keys={};resetPositions();$('clock').textContent='90';$('score').textContent='0 : 0';$('pause').textContent='Ⅱ 일시정지';$('overlay').classList.add('hidden');running=true;requestAnimationFrame(loop)}
$('start').onclick=start;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'▶ 계속':'Ⅱ 일시정지';if(!paused){last=0;requestAnimationFrame(loop)}};
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);
[['up','ArrowUp'],['down','ArrowDown'],['left','ArrowLeft'],['right','ArrowRight'],['shoot',' ']].forEach(([id,k])=>{let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
draw();
})();
</script></body></html>
